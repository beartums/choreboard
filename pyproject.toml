[project]
name = "choreboard"
version = "0.1.0"
description = "Household chores as a calendar: schedule rules give the defaults, date overrides win."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pyjwt[crypto]>=2.15",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
