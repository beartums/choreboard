[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "choreboard"
version = "0.1.0"
description = "Household chores as a calendar: schedule rules give the defaults, date overrides win."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pyjwt[crypto]>=2.15",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28", "hypothesis>=6.169", "coverage>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["choreboard"]

[tool.setuptools.package-data]
choreboard = ["static/*", "static/assets/*"]
