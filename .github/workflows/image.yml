name: image

# Multi-arch images to ghcr.io/<owner>/choreboard:
#   sha-<full sha>   every push to main (and tags) -- immutable, pin these
#   vX.Y.Z           when a vX.Y.Z tag is pushed -- what griflab deploys
#   latest           main, for convenience; never what a cluster should run
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image would build with broken code and die on start; test first.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -e '.[test]' && pytest -q

      # amd64 AND arm64: the cluster has Raspberry Pi workers, and a pod that
      # lands on one needs an arm64 image. Every dependency ships arm64
      # wheels, so QEMU only emulates; nothing compiles.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/choreboard
          tags: |
            type=sha,format=long
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: CHOREBOARD_VERSION=${{ github.ref_name }}@${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
